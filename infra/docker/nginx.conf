# ---------------------------------------------------------------------------
# nginx config for @oao/addin (static Vite build: taskpane.html,
# commands.html, assets/, manifest/).
#
# Office Add-ins MUST be served over HTTPS and MUST be embeddable inside
# Outlook's iframe — so we deliberately do NOT send X-Frame-Options:
# DENY/SAMEORIGIN; framing is scoped instead with a CSP frame-ancestors list
# of the Microsoft 365 hosts allowed to embed the task pane.
#
# Runs as the unprivileged nginx user (uid 101) with a read-only root
# filesystem: every writable path below is an emptyDir/tmpfs in Kubernetes.
# ---------------------------------------------------------------------------

worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 1m;

  # Writable temp paths for a non-root, read-only-rootfs container.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  access_log /dev/stdout combined;
  error_log  /dev/stderr warn;

  gzip on;
  gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml font/woff2;
  gzip_min_length 512;

  # Hosts allowed to embed the task pane. This is the ONLY CSP directive the
  # header carries: the full policy (default-src, script-src, connect-src...)
  # is baked into the <meta> tag of taskpane.html / commands.html at build
  # time by apps/addin/src/security/csp.ts. Sending a second, narrower policy
  # here would intersect with it and break office.js (two policies are both
  # enforced), so the header is limited to what a meta tag cannot express —
  # `HEADER_ONLY_DIRECTIVES` in that same module.
  #
  # Value copied verbatim from `frameAncestors()` in
  # apps/addin/src/security/csp.ts — keep the two in sync.
  map $host $office_frame_csp {
    default "frame-ancestors 'self' https://appsforoffice.microsoft.com https://*.office.net https://*.officeapps.live.com https://outlook.office.com https://outlook.office365.com https://outlook.live.com https://*.outlook.com";
  }

  # Caching policy by path. Single source of truth: `add_header` inside a
  # location REPLACES the inherited set, so all headers are declared once at
  # server level and the value varies through this map instead.
  #
  #   /assets/*          content-hashed by Vite -> immutable, one year
  #   taskpane.html, commands.html, commands.js, /manifest/*
  #                      reference the hashed assets -> never long-cached
  map $uri $oao_cache_control {
    default        "no-cache, must-revalidate";
    "~^/assets/"   "public, max-age=31536000, immutable";
  }

  server {
    listen 3000 ssl;
    listen [::]:3000 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/addin.crt;
    ssl_certificate_key /etc/nginx/certs/addin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:2m;
    ssl_session_timeout 1h;

    root /usr/share/nginx/html;
    index taskpane.html;

    # Security / Office-add-in headers. No X-Frame-Options here: framing is
    # controlled by CSP frame-ancestors so Outlook can embed the pane.
    add_header Content-Security-Policy $office_frame_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $oao_cache_control always;

    # Office manifests (baked at build time from ADDIN_HOST/API_HOST/
    # AAD_CLIENT_ID): used by M365 centralised deployment and `Add from URL`.
    location /manifest/ {
      try_files $uri =404;
    }

    # Source maps are built "hidden" (no sourceMappingURL comment), so no
    # browser ever asks for them. They must not be readable from the internet
    # either: ship them to the error tracker out of band instead
    # (apps/addin/README.md §static hosting).
    location ~* \.map$ {
      access_log off;
      return 404;
    }

    # Hashed, versioned build assets: long-lived immutable cache (see map).
    location /assets/ {
      try_files $uri =404;
    }

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location / {
      try_files $uri $uri/ =404;
    }
  }
}
