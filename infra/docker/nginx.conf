# ---------------------------------------------------------------------------
# nginx config for @oao/addin (static Vite build: taskpane.html, commands.html,
# assets/). Office Add-ins MUST be served over HTTPS and MUST be embeddable
# inside Outlook's iframe — so we deliberately do NOT send X-Frame-Options:
# DENY/SAMEORIGIN; framing is scoped instead with a CSP frame-ancestors list of
# the Microsoft 365 hosts allowed to embed the task pane.
# ---------------------------------------------------------------------------

worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;
  server_tokens off;

  # Writable temp paths for a non-root/unprivileged nginx container.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;
  gzip_min_length 512;

  map $sent_http_content_type $office_frame_csp {
    default "frame-ancestors https://*.office.com https://*.office365.com https://*.outlook.com https://outlook.live.com https://*.microsoft.com https://outlook.office.com https://outlook.office365.com;";
  }

  server {
    listen 3000 ssl default_server;
    listen [::]:3000 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/addin.crt;
    ssl_certificate_key /etc/nginx/certs/addin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index taskpane.html;

    # Security / Office-add-in headers. No X-Frame-Options here: framing is
    # controlled by CSP frame-ancestors below so Outlook can embed the pane.
    add_header Content-Security-Policy $office_frame_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # office.js / manifest files must not be aggressively cached.
    location = /taskpane.html {
      add_header Cache-Control "no-cache, must-revalidate";
      try_files $uri =404;
    }
    location = /commands.html {
      add_header Cache-Control "no-cache, must-revalidate";
      try_files $uri =404;
    }

    # Hashed, versioned build assets: long-lived immutable cache.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ =404;
    }

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }
  }
}
