apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oao.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "oao.componentLabels" (list . "orchestrator") | indent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
data:
{{ include "oao.config.data" . | indent 2 }}
