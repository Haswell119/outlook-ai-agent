{{- if .Values.externalSecrets.enabled }}
# Requires the External Secrets Operator (ESO). The operator materialises the
# Secret <fullname>-secrets, which every workload of this chart then consumes
# exactly as if it had been created by Helm.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "oao.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "oao.componentLabels" (list . "orchestrator") | indent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "oao.fullname" . }}-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  {{- range $key, $ref := .Values.externalSecrets.data }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $ref.key | quote }}
        {{- with $ref.property }}
        property: {{ . | quote }}
        {{- end }}
        {{- with $ref.version }}
        version: {{ . | quote }}
        {{- end }}
  {{- end }}
{{- end }}
