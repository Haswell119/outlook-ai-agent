{{- if .Values.admin.enabled }}
{{- $secret := include "oao.secretName" . -}}
{{- $tenant := .Values.admin.entra.tenantId | default .Values.auth.aad.tenantId -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oao.fullname" . }}-admin
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "oao.componentLabels" (list . "admin") | indent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.admin.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
{{ include "oao.selectorLabels" (list . "admin") | indent 6 }}
  template:
    metadata:
      labels:
{{ include "oao.selectorLabels" (list . "admin") | indent 8 }}
        {{- with .Values.admin.podLabels }}
{{ toYaml . | indent 8 }}
        {{- end }}
      annotations:
{{ include "oao.checksums" . | indent 8 }}
        {{- with .Values.admin.podAnnotations }}
{{ toYaml . | indent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "oao.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- include "oao.imagePullSecrets" . | nindent 6 }}
      securityContext:
{{ toYaml .Values.admin.securityContext | indent 8 }}
      {{- with .Values.admin.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.admin.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.admin.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - name: admin
          image: {{ include "oao.image" (list . "admin" .Values.admin.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3001"
            - name: HOSTNAME
              value: 0.0.0.0
            - name: ORCHESTRATOR_URL
              value: {{ printf "http://%s-api:%v" (include "oao.fullname" .) .Values.orchestrator.service.port | quote }}
            - name: ADMIN_MOCK
              value: {{ .Values.admin.mock | quote }}
            - name: ADMIN_AUTH_MODE
              value: {{ .Values.admin.authMode | quote }}
            # Names come from apps/admin/src/env.ts — the dashboard has its own
            # schema and ignores the orchestrator's DEFAULT_LANGUAGE /
            # ORGANIZATION_NAME.
            - name: ADMIN_DEFAULT_LANGUAGE
              value: {{ .Values.config.defaultLanguage | quote }}
            - name: ADMIN_TENANT_NAME
              value: {{ .Values.config.organizationName | quote }}
            - name: ADMIN_TZ
              value: {{ .Values.admin.timezone | default .Values.config.timezone | quote }}
            - name: ADMIN_SESSION_MAX_AGE
              value: {{ .Values.admin.sessionMaxAgeSeconds | quote }}
            # Role fallback when the tenant has not assigned the app roles yet;
            # `roles` claims from the access token always win.
            - name: ADMIN_EMAILS
              value: {{ .Values.auth.adminEmails | quote }}
            - name: COMPLIANCE_EMAILS
              value: {{ .Values.auth.complianceEmails | quote }}
            {{- if eq .Values.admin.authMode "aad" }}
            - name: AUTH_URL
              value: {{ printf "https://%s" .Values.hosts.admin | quote }}
            - name: AUTH_MICROSOFT_ENTRA_ID_ID
              value: {{ .Values.admin.entra.clientId | quote }}
            - name: AUTH_MICROSOFT_ENTRA_ID_ISSUER
              value: {{ .Values.admin.entra.issuer | default (printf "https://login.microsoftonline.com/%s/v2.0" $tenant) | quote }}
            # Scope requested at sign-in so the session carries an access token
            # whose audience the orchestrator accepts. env.ts refuses to boot in
            # aad mode when neither of the two is set.
            {{- if .Values.admin.apiScope }}
            - name: ORCHESTRATOR_API_SCOPE
              value: {{ .Values.admin.apiScope | quote }}
            {{- else }}
            - name: ORCHESTRATOR_API_CLIENT_ID
              value: {{ .Values.admin.orchestratorApiClientId | default .Values.auth.aad.clientId | quote }}
            {{- end }}
            - name: AUTH_MICROSOFT_ENTRA_ID_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: AUTH_MICROSOFT_ENTRA_ID_SECRET
                  optional: true
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: AUTH_SECRET
                  optional: true
            {{- end }}
            - name: ADMIN_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: ADMIN_API_TOKEN
                  optional: true
            {{- with .Values.admin.extraEnv }}
{{ toYaml . | indent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.admin.probes.path }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: {{ .Values.admin.probes.path }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
{{ toYaml .Values.admin.resources | indent 12 }}
          securityContext:
{{ toYaml .Values.admin.containerSecurityContext | indent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # Next.js writes its ISR/fetch cache next to the standalone server.
            - name: next-cache
              mountPath: /app/apps/admin/.next/cache
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oao.fullname" . }}-admin
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "oao.componentLabels" (list . "admin") | indent 4 }}
  {{- with .Values.admin.service.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  type: {{ .Values.admin.service.type }}
  ports:
    - name: http
      port: {{ .Values.admin.service.port }}
      targetPort: http
      protocol: TCP
  selector:
{{ include "oao.selectorLabels" (list . "admin") | indent 4 }}
{{- if .Values.admin.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "oao.fullname" . }}-admin
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "oao.componentLabels" (list . "admin") | indent 4 }}
spec:
  minAvailable: {{ .Values.admin.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
{{ include "oao.selectorLabels" (list . "admin") | indent 6 }}
{{- end }}
{{- end }}
