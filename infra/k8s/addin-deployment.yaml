apiVersion: apps/v1
kind: Deployment
metadata:
  name: addin
  namespace: oao
  labels:
    app: addin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: addin
  template:
    metadata:
      labels:
        app: addin
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # nginx user in nginxinc/nginx-unprivileged
        fsGroup: 101
      containers:
        - name: addin
          # Built from infra/docker/addin.Dockerfile (VITE_* baked in at build
          # time) — replace with your registry.
          image: registry.northbridge.local/oao/addin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 3000
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: addin
  namespace: oao
  labels:
    app: addin
spec:
  selector:
    app: addin
  ports:
    - name: https
      port: 3000
      targetPort: https
