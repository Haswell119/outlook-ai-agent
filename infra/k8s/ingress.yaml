# One Ingress object per service because the add-in backend terminates TLS
# itself (nginx-unprivileged serving HTTPS on 3000) while orchestrator/admin
# are plain HTTP — the nginx-ingress backend-protocol annotation is per
# Ingress object, so they can't share a single one cleanly.
#
# TLS: `oao-tls-cert` is a placeholder secret name. Provision it with
# cert-manager (recommended, e.g. a ClusterIssuer + this Ingress annotated
# with `cert-manager.io/cluster-issuer: ...`) or `kubectl create secret tls`
# from a certificate issued by Northbridge's internal CA. Never commit the actual
# secret.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orchestrator
  namespace: oao
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "2m" # matches the orchestrator's 2 MB request size limit
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["api.oao.northbridge.local"]
      secretName: oao-tls-cert
  rules:
    - host: api.oao.northbridge.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orchestrator
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin
  namespace: oao
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["admin.oao.northbridge.local"]
      secretName: oao-tls-cert
  rules:
    - host: admin.oao.northbridge.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin
                port:
                  number: 3001
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: addin
  namespace: oao
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # The addin container serves HTTPS itself (self-signed unless a real cert
    # is mounted) — tell ingress-nginx to speak TLS to the pod too.
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["addin.oao.northbridge.local"]
      secretName: oao-tls-cert
  rules:
    - host: addin.oao.northbridge.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: addin
                port:
                  number: 3000
