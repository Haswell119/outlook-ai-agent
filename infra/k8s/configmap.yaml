# Non-secret configuration, shared by the orchestrator (and read partly by the
# admin/addin deployments). Secrets (LLM_API_KEY, AAD_CLIENT_SECRET,
# ADMIN_API_TOKEN, POSTGRES_PASSWORD, ...) live in secret.example.yaml instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oao-config
  namespace: oao
data:
  # --- LLM ---
  LLM_PROVIDER: "openai-compatible"
  LLM_BASE_URL: "http://gpu-node.northbridge.local:8000/v1"
  LLM_MODEL: "qwen3-30b-a3b"
  LLM_TIMEOUT_MS: "60000"
  LLM_MAX_TOKENS: "2048"
  LLM_JSON_MODE: "auto"
  EMBEDDINGS_ENABLED: "true"
  EMBEDDING_MODEL: "bge-m3"
  EMBEDDING_DIMENSIONS: "1024"

  # --- Database (host/db name only; credentials come from the Secret) ---
  DB_AUTO_MIGRATE: "false" # applied by the migrate-seed Job instead, see job-migrate.yaml
  POSTGRES_HOST: "postgres.oao.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "oao"

  # --- Auth ---
  AUTH_MODE: "aad"
  ADMIN_EMAILS: "admin@northbridge.example"
  COMPLIANCE_EMAILS: "compliance@northbridge.example"

  # --- Graph ---
  GRAPH_ENABLED: "false"

  # --- Misc ---
  PORT: "8080"
  CORS_ORIGINS: "https://addin.oao.northbridge.local"
  AUDIT_STORE_CONTENT: "false"
  NOTIFY_WEBHOOK_URL: ""
  DEFAULT_LANGUAGE: "fr"
  LOG_LEVEL: "info"
  RATE_LIMIT_PER_MINUTE: "120"

  # --- Admin dashboard ---
  ORCHESTRATOR_URL: "http://orchestrator.oao.svc.cluster.local:8080"
  ADMIN_MOCK: "false"

  # --- Add-in (build-time only; kept here for reference / rebuild scripts) ---
  VITE_API_BASE_URL: "https://api.oao.northbridge.local/api/v1"
  VITE_ADMIN_URL: "https://admin.oao.northbridge.local"
  VITE_AUTH_MODE: "aad"
  VITE_API_MOCK: "false"
