apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: oao

resources:
  - namespace.yaml
  - configmap.yaml
  # secret.example.yaml is a TEMPLATE, deliberately not included here — copy
  # it, fill in real values, and apply it (or your secret manager's output)
  # separately: `kubectl apply -f infra/k8s/secret.local.yaml`.
  - postgres-statefulset.yaml
  - orchestrator-deployment.yaml
  - admin-deployment.yaml
  - addin-deployment.yaml
  - ingress.yaml
  - job-migrate.yaml

commonLabels:
  app.kubernetes.io/part-of: outlook-ai-orchestrator
