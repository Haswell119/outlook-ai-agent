# One-shot Job: applies SQL migrations then seeds reference data. Run it after
# a fresh deploy or after upgrading the orchestrator image:
#
#   kubectl -n oao delete job oao-migrate --ignore-not-found
#   kubectl apply -f infra/k8s/job-migrate.yaml
#   kubectl -n oao wait --for=condition=complete job/oao-migrate --timeout=300s
apiVersion: batch/v1
kind: Job
metadata:
  name: oao-migrate
  namespace: oao
  labels:
    app: oao-migrate
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: oao-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: migrate
          image: registry.longbow.local/oao/orchestrator:latest
          # Same image as the orchestrator Deployment; overrides its CMD to
          # run the migration + seed scripts instead of starting the server.
          command:
            - "sh"
            - "-c"
            - "node apps/orchestrator/dist/adapters/db/migrate.js && node apps/orchestrator/dist/adapters/db/seed.js"
          envFrom:
            - configMapRef:
                name: oao-config
            - secretRef:
                name: oao-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
