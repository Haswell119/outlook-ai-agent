apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: oao
  labels:
    app: admin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: admin
          # Built from infra/docker/admin.Dockerfile — replace with your registry.
          image: registry.northbridge.local/oao/admin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: ORCHESTRATOR_URL
              valueFrom:
                configMapKeyRef:
                  name: oao-config
                  key: ORCHESTRATOR_URL
            - name: ADMIN_MOCK
              valueFrom:
                configMapKeyRef:
                  name: oao-config
                  key: ADMIN_MOCK
            - name: ADMIN_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: oao-secrets
                  key: ADMIN_API_TOKEN
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: oao
  labels:
    app: admin
spec:
  selector:
    app: admin
  ports:
    - name: http
      port: 3001
      targetPort: http
