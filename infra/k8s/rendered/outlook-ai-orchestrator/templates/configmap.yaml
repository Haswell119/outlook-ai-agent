---
# Source: outlook-ai-orchestrator/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: oao-config
  namespace: oao
  labels:
    helm.sh/chart: outlook-ai-orchestrator-0.1.0
    app.kubernetes.io/name: outlook-ai-orchestrator
    app.kubernetes.io/instance: oao
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: outlook-ai-orchestrator
    app.kubernetes.io/component: orchestrator
data:
  NODE_ENV: "production"
  PORT: "8080"
  HOST: "0.0.0.0"
  APP_VERSION: "0.1.0"
  ORGANIZATION_NAME: "Northbridge Capital"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  DEFAULT_LANGUAGE: "fr"
  INTERNAL_DOMAINS: "northbridge.example"
  CORS_ORIGINS: "https://addin.oao.northbridge.example"
  RATE_LIMIT_PER_MINUTE: "120"
  BODY_LIMIT_BYTES: "2.097152e+06"
  REQUEST_TIMEOUT_MS: "30000"
  SHUTDOWN_TIMEOUT_MS: "15000"
  AUDIT_STORE_CONTENT: "false"
  AUDIT_RETENTION_DAYS: "1095"
