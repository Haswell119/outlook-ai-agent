# Source: outlook-ai-orchestrator/templates/addin.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oao-addin
  namespace: oao
  labels:
    helm.sh/chart: outlook-ai-orchestrator-0.1.0
    app.kubernetes.io/name: outlook-ai-orchestrator
    app.kubernetes.io/instance: oao
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: outlook-ai-orchestrator
    app.kubernetes.io/component: addin
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: outlook-ai-orchestrator
      app.kubernetes.io/instance: oao
      app.kubernetes.io/component: addin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: outlook-ai-orchestrator
        app.kubernetes.io/instance: oao
        app.kubernetes.io/component: addin
      annotations:
        checksum/tls-mode: 89055649c3e2aac5
    spec:
      serviceAccountName: oao
      automountServiceAccountToken: false
      
      imagePullSecrets:
      - name: ghcr-pull
      securityContext:
        fsGroup: 101
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      affinity:
        
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: outlook-ai-orchestrator
                    app.kubernetes.io/instance: oao
                    app.kubernetes.io/component: addin
      containers:
        - name: addin
          image: "ghcr.io/northbridge-capital/oao-addin:0.1.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 3000
              protocol: TCP
          env:
            # Only used by the entrypoint when it has to fall back to a
            # self-signed certificate (CN). The bundle and the Office
            # manifests are baked at build time — see infra/docker/README.md.
            - name: ADDIN_HOST
              value: "addin.oao.northbridge.example"
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            limits:
              cpu: 250m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: certs
              mountPath: /etc/nginx/certs
              readOnly: true
            # nginx runs with a read-only root filesystem: every path it needs
            # to write is an emptyDir (see infra/docker/nginx.conf).
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-conf-d
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: certs
          secret:
            secretName: oao-addin-tls
            defaultMode: 0400
            items:
              - key: tls.crt
                path: addin.crt
              - key: tls.key
                path: addin.key
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-cache
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-conf-d
          emptyDir:
            sizeLimit: 8Mi
---
