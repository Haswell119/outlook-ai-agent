apiVersion: v1
kind: Service
metadata:
  name: oao-addin
  namespace: oao
  labels:
    helm.sh/chart: outlook-ai-orchestrator-0.1.0
    app.kubernetes.io/name: outlook-ai-orchestrator
    app.kubernetes.io/instance: oao
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: outlook-ai-orchestrator
    app.kubernetes.io/component: addin
  annotations:
    # The pod terminates TLS itself: Traefik must speak HTTPS to it.
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: oao-oao-addin@kubernetescrd
spec:
  type: ClusterIP
  ports:
    - name: https
      port: 3000
      targetPort: https
      protocol: TCP
  selector:
    app.kubernetes.io/name: outlook-ai-orchestrator
    app.kubernetes.io/instance: oao
    app.kubernetes.io/component: addin
