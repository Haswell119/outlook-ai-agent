---
# Source: outlook-ai-orchestrator/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oao-api
  namespace: oao
  labels:
    helm.sh/chart: outlook-ai-orchestrator-0.1.0
    app.kubernetes.io/name: outlook-ai-orchestrator
    app.kubernetes.io/instance: oao
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: outlook-ai-orchestrator
    app.kubernetes.io/component: orchestrator-api
  annotations:
    
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: oao-oao-body-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - "api.oao.northbridge.example"
      secretName: oao-api-tls
  rules:
    - host: "api.oao.northbridge.example"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oao-api
                port:
                  number: 8080
