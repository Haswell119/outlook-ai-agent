# TEMPLATE ONLY — never apply this file as-is and never commit real values.
# Copy it (e.g. to secret.local.yaml, gitignored), fill in real secrets, and
# `kubectl apply -f` the copy — or better, generate it with
# `kubectl create secret generic oao-secrets --from-literal=... --dry-run=client -o yaml`
# or a secret manager (Sealed Secrets, External Secrets Operator, Vault).
apiVersion: v1
kind: Secret
metadata:
  name: oao-secrets
  namespace: oao
type: Opaque
stringData:
  # --- LLM ---
  LLM_API_KEY: "REPLACE_ME" # empty string is valid if Longbow's endpoint needs none

  # --- Database ---
  POSTGRES_USER: "oao"
  POSTGRES_PASSWORD: "REPLACE_ME"
  DATABASE_URL: "postgres://oao:REPLACE_ME@postgres.oao.svc.cluster.local:5432/oao"

  # --- Azure AD ---
  AAD_TENANT_ID: "REPLACE_ME"
  AAD_CLIENT_ID: "REPLACE_ME"
  AAD_CLIENT_SECRET: "REPLACE_ME"

  # --- Admin dashboard bearer token (dev-style auth; prefer AAD in prod) ---
  ADMIN_API_TOKEN: "REPLACE_ME"
