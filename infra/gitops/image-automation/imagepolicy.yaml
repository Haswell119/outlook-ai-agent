# Production : dernière version semver stable.
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: oao
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: oao
  policy:
    semver:
      range: ">=0.1.0"
---
# Dev : dernière image construite depuis main (tag `main-<sha>`).
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: oao-dev
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: oao
  filterTags:
    pattern: '^main-(?P<ts>[0-9]+)-.*$'
    extract: '$ts'
  policy:
    numerical:
      order: asc
