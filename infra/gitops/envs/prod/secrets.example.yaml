# GABARIT — ne jamais committer ce fichier avec de vraies valeurs en clair.
#
#   cp secrets.example.yaml secrets.enc.yaml
#   $EDITOR secrets.enc.yaml              # valeurs réelles
#   sops --encrypt --in-place secrets.enc.yaml
#   git add secrets.enc.yaml              # chiffré : sûr en dépôt public
#
# Les clés sont celles attendues par le chart
# (values secrets.existingSecretKeys).
apiVersion: v1
kind: Secret
metadata:
  name: oao-secrets
  namespace: oao
type: Opaque
stringData:
  # Vide si l'endpoint LLM interne n'exige pas de clé.
  LLM_API_KEY: ""
  # Secret client de l'App registration API (échange On-Behalf-Of vers Graph).
  AAD_CLIENT_SECRET: ""
  # Jeton partagé dashboard admin -> orchestrator.
  ADMIN_API_TOKEN: ""
  # Bearer token de /metrics (utilisé par le ServiceMonitor).
  METRICS_TOKEN: ""
  # Connexion PostgreSQL complète.
  DATABASE_URL: "postgres://oao:...@oao-postgres:5432/oao"
  # Mot de passe du StatefulSet PostgreSQL interne (postgres.enabled=true) —
  # doit correspondre à celui de DATABASE_URL.
  POSTGRES_PASSWORD: ""
  # Dashboard admin (Auth.js / Entra ID).
  AUTH_MICROSOFT_ENTRA_ID_SECRET: ""
  AUTH_SECRET: ""
