apiVersion: v1
kind: Namespace
metadata:
  name: oao-dev
  labels:
    app.kubernetes.io/part-of: outlook-ai-orchestrator
    # Sélecteur utilisé par les NetworkPolicies des autres namespaces.
    kubernetes.io/metadata.name: oao-dev-dev
    # Pod Security Admission : le chart ne demande aucun privilège.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
