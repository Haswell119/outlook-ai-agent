name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Lundi 04:17 UTC — hors heures ouvrées, décalé pour éviter la minute pleine.
    - cron: "17 4 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # security-extended adds the injection/SSRF/secret-in-log queries that
          # matter for an LLM orchestrator handling email content.
          queries: security-extended
          config: |
            paths-ignore:
              - "**/node_modules"
              - "**/dist"
              - "**/.next"
              - "**/coverage"
              - "infra/k8s/rendered"

      # No custom build: the JS/TS extractor analyses the sources directly, and
      # a full pnpm build would only slow the scan down.
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
