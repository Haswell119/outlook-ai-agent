# ---------------------------------------------------------------------------
# Dev: PostgreSQL/pgvector only. Developers run the three apps themselves with
# npm (hot reload).
#
#   npm run dev:db           # up + wait until healthy (wraps this file)
#   npm run dev:db -- reset  # wipe the volume and start again
#   npm run dev              # orchestrator :8080 · addin :3000 · admin :3001
#
# Named volume only and no host networking, so it behaves the same on Docker
# Desktop (Windows/macOS) and Docker Engine (Linux).
# ---------------------------------------------------------------------------

name: oao-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oao}
      POSTGRES_DB: ${POSTGRES_DB:-oao}
      # Sub-path: the image refuses to initialise a non-empty mount point.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - oao_dev_postgres_data:/var/lib/postgresql/data
      # Creates the `vector` extension on first init (empty volume only).
      - ./infra/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oao} -d ${POSTGRES_DB:-oao}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  oao_dev_postgres_data:
