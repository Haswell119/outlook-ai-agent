<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- OAO_CSP: replaced at build time by vite.config.ts (security/csp.ts). -->
    <title>Outlook AI Orchestrator — host simulator</title>
    <!--
      The Office.js **simulator** replaces the Microsoft CDN script: it is the
      whole point of this page, so office.js is deliberately not loaded here.
      Order matters — fixtures, then the host, then the control bar, then the
      pane (which calls `Office.onReady` as soon as its module runs).
    -->
    <script src="./e2e/office-sim/fixtures.js"></script>
    <script src="./e2e/office-sim/office-sim.js"></script>
    <script src="./e2e/office-sim/sim-page.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        color-scheme: light dark;
        background: #f5f5f5;
        font-family: "Segoe UI", "Segoe UI Web (West European)", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", sans-serif;
      }
      body {
        min-width: 320px;
      }
      #root {
        min-height: 100vh;
      }
      .oao-visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
          scroll-behavior: auto !important;
        }
      }
      :focus-visible {
        outline: 2px solid var(--oao-focus, #0f6cbd);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This add-in requires JavaScript.</noscript>
    <script type="module" src="./src/taskpane/main.tsx"></script>
  </body>
</html>
