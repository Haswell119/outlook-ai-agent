<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- OAO_CSP: replaced at build time by scripts/../vite.config.ts (security/csp.ts). -->
    <title>Outlook AI Orchestrator</title>
    <!-- Office.js must be loaded before any other script. -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        /* Painted before the theme stylesheet lands, so it must not flash white
           in dark mode: `color-scheme` lets the UA pick the right canvas. */
        color-scheme: light dark;
        background: #f5f5f5;
        font-family: "Segoe UI", "Segoe UI Web (West European)", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", sans-serif;
      }
      /* The pane must stay usable at the narrowest width Outlook allows. */
      body {
        min-width: 320px;
      }
      #root {
        min-height: 100vh;
      }
      /* Accessible "visually hidden": readable by screen readers, invisible. */
      .oao-visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
      /* Respect the OS "reduce motion" setting for every animation and
         transition, including Fluent's own. */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
          scroll-behavior: auto !important;
        }
      }
      [data-oao-motion="reduce"] *,
      [data-oao-motion="reduce"] *::before,
      [data-oao-motion="reduce"] *::after {
        animation-duration: 0.001ms !important;
        transition-duration: 0.001ms !important;
      }
      /* Always show a visible focus ring, even where Fluent removes it. */
      :focus-visible {
        outline: 2px solid var(--oao-focus, #0f6cbd);
        outline-offset: 2px;
      }
      @media (forced-colors: active) {
        :focus-visible {
          outline-color: Highlight;
        }
      }
      #oao-skip {
        position: absolute;
        inset-inline-start: -9999px;
        top: 0;
        z-index: 99;
        background: var(--oao-card, #fff);
        color: var(--oao-primary, #0f6cbd);
        padding: 8px 12px;
        border-radius: 0 0 6px 0;
        font-size: 13px;
        font-weight: 600;
      }
      #oao-skip:focus {
        inset-inline-start: 0;
      }
    </style>
  </head>
  <body>
    <a id="oao-skip" href="#oao-main">Skip to content</a>
    <div id="root"></div>
    <noscript>This add-in requires JavaScript.</noscript>
    <script type="module" src="./src/taskpane/main.tsx"></script>
  </body>
</html>
